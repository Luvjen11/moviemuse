# Build Spring Boot backend from subdirectory and deploy JAR to Azure App Service.
name: Backend — build & deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: moviemuse-backend-211
  JAVA_VERSION: "21"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    defaults:
      run:
        working-directory: moviemuse-backend/moviemuse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # Secret created by Deployment Center → GitHub Actions (name is usually AZURE_WEBAPP_PUBLISH_PROFILE).
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Matches moviemuse-backend/moviemuse/pom.xml <version>
          package: ${{ github.workspace }}/moviemuse-backend/moviemuse/target/moviemuse-0.0.1-SNAPSHOT.jar
